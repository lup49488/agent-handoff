# Store settings. utc_offset is the store's fixed offset from UTC; none of the
# stores observes daylight saving. day_cutoff_hour is the local hour at which
# one business day ends and the next begins.

[store:A]
utc_offset = +01:00
day_cutoff_hour = 4
currency = EUR

[store:B]
utc_offset = -03:30
day_cutoff_hour = 4
currency = CAD

[store:C]
utc_offset = +05:45
day_cutoff_hour = 4
currency = NPR
